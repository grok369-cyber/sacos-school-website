name: Deploy Sanity Studio

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: "Sanity Studio hostname, e.g. savio-secondary-school"
        required: true
        default: "savio-secondary-school"
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify Sanity CLI
        run: npx sanity --version

      - name: Verify styled-components
        run: node -e "console.log('styled-components:', require.resolve('styled-components'))"

      - name: Deploy Studio to Sanity
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity deploy --url "${{ inputs.hostname }}" --yes --schema-required
